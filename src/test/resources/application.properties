baseUrl=http://localhost:9966/petclinic

# true: тесты сами поднимают PetClinic в Docker через Testcontainers; baseUrl при этом не используется
petclinic.testcontainers.enabled=false
petclinic.testcontainers.image=springcommunity/spring-petclinic-rest:3.4.0

# true: логировать в консоль каждый запрос и ответ; false: только при падении проверок RestAssured
api.logging.all=false

spring.main.banner-mode=off
